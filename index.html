  <title>방송은 어려워</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#181b2b;color:#f2f0f6}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center}
    #game-shell{position:relative;display:grid;place-items:center;width:100%;height:100%;background:#181b2b}
    #game-shell:fullscreen{width:100vw;height:100vh}#unity-canvas{display:block;width:min(100vw,160vh);height:min(62.5vw,100vh);outline:none;background:#181b2b;touch-action:none}
    #cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#181b2b;z-index:2;padding:24px}
    #cover[hidden]{display:none}.intro{width:min(440px,100%);text-align:center}h1{font-size:clamp(30px,5vw,48px);font-weight:650;letter-spacing:-.06em;margin:0 0 20px;color:#72e6c4}

<body>
  <main id="game-shell" aria-label="방송은 어려워">

  <script>
    (() => {
      "use strict";
      const canvas=document.getElementById("unity-canvas"),cover=document.getElementById("cover"),message=document.getElementById("message"),progress=document.getElementById("progress"),action=document.getElementById("action"),saveStatus=document.getElementById("save-status");
      let failed=false,quitting=false;
      const reveal=(text,label,handler)=>{message.textContent=text;progress.hidden=true;action.textContent=label;action.onclick=handler;action.hidden=false;cover.hidden=false;};
      const fail=(error)=>{if(failed)return;failed=true;releaseChunkBlobs();console.error(error);reveal("게임을 불러오지 못했어요.","다시 불러오기",()=>location.reload());};
      const config={
        dataUrl:"Build/fa853c1a03c618d038dc4e0cfdc37970.data.unityweb",
        frameworkUrl:"Build/640da60070d330c08dd66a502d24893d.framework.js.unityweb",
        codeUrl:"Build/7312dc10ccce640509d52c2a4d3673f4.wasm.unityweb",
        streamingAssetsUrl:"StreamingAssets",
        companyName:"LocalWorkshop",
        productName:"방송은 어려워",
        productVersion:"0.1.0",
        autoSyncPersistentDataPath:false,
        matchWebGLToCanvasSize:true,
        devicePixelRatio:Math.min(window.devicePixelRatio||1,2),
        showBanner:(text,type)=>{if(type==="error")fail(text);else console.warn(text);}
      };
      const chunkInput=document.getElementById("streamer-chunks");
      const chunkManifest=chunkInput?JSON.parse(chunkInput.textContent):null;
      const chunkAssets=chunkManifest&&chunkManifest.assets?Object.entries(chunkManifest.assets):[];
      const chunkBlobUrls=[];
      const releaseChunkBlobs=()=>{for(const url of chunkBlobUrls)URL.revokeObjectURL(url);chunkBlobUrls.length=0;};
      async function prepareChunkedAssets(){
        if(!chunkAssets.length)return;
        if(chunkManifest.schema!==1||!window.crypto||!window.crypto.subtle)throw new Error("Chunk integrity verification unavailable");
        const allowed=new Set(["dataUrl","codeUrl","frameworkUrl"]);
        let received=0;
        const total=chunkAssets.reduce((sum,[,asset])=>sum+asset.bytes,0);
        if(!Number.isSafeInteger(total)||total<=0||total>1024*1024*1024)throw new Error("Invalid chunk manifest size");
        for(const [field,asset] of chunkAssets){
          if(!allowed.has(field)||!Number.isSafeInteger(asset.bytes)||asset.bytes<=0||!Array.isArray(asset.parts)||!asset.parts.length||asset.parts.length>64)throw new Error("Invalid chunk manifest");
          const parts=new Array(asset.parts.length);let next=0;
          const loadPart=async()=>{
            while(next<asset.parts.length){
              const index=next++,part=asset.parts[index];
              if(part.index!==index||!Number.isSafeInteger(part.bytes)||part.bytes<=0||part.bytes>25*1024*1024||!/^[a-f0-9]{64}$/.test(part.sha256))throw new Error("Invalid chunk descriptor");
              const url=new URL(part.url,document.baseURI);
              if(url.origin!==location.origin)throw new Error("Unexpected chunk origin");
              const response=await fetch(url.href,{cache:"force-cache"});
              if(!response.ok)throw new Error("Chunk download failed: "+response.status);
              const bytes=await response.arrayBuffer();
              if(bytes.byteLength!==part.bytes)throw new Error("Chunk size mismatch");
              const digest=await crypto.subtle.digest("SHA-256",bytes);
              const hash=Array.from(new Uint8Array(digest),value=>value.toString(16).padStart(2,"0")).join("");
              if(hash!==part.sha256)throw new Error("Chunk integrity mismatch");
              parts[index]=bytes;received+=bytes.byteLength;
              progress.value=.65*received/total;
              message.textContent="불러오는 중… "+Math.round(progress.value*100)+"%";
            }
          };
          await Promise.all(Array.from({length:Math.min(2,parts.length)},loadPart));
          const blob=new Blob(parts,{type:"application/octet-stream"});
          if(blob.size!==asset.bytes)throw new Error("Reassembled asset size mismatch");
          const blobUrl=URL.createObjectURL(blob);chunkBlobUrls.push(blobUrl);config[field]=blobUrl;
          parts.length=0;
        }
      }
      window.streamerHardQuit=async()=>{
        if(quitting)return;
        quitting=true;
        try{
          const instance=window.streamerHardInstance;
          if(instance)await instance.Quit();
          window.streamerHardInstance=null;
          saveStatus.textContent="";
          if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});
          reveal("저장했어요.","다시 시작",()=>location.reload());
        }catch(error){console.error(error);reveal("저장했어요. 이 탭을 닫아도 괜찮아요.","다시 시작",()=>location.reload());}
      };
      const loader=document.createElement("script");
      loader.src="Build/bd1798f9437d1d60c30960d35c623ed0.loader.js";
      loader.onerror=()=>fail("Unity loader download failed");
      loader.onload=()=>{
        if(typeof createUnityInstance!=="function"){fail("Unity loader is unavailable");return;}
        prepareChunkedAssets().then(()=>createUnityInstance(canvas,config,value=>{
          progress.value=chunkAssets.length ? .65+.35*value : value;
          message.textContent="불러오는 중… "+Math.round(progress.value*100)+"%";
        })).then(instance=>{
          if(failed){instance.Quit();return;}
          window.streamerHardInstance=instance;
          reveal("준비됐어요.","방송 시작",()=>{cover.hidden=true;canvas.focus();});
        }).catch(fail).finally(releaseChunkBlobs);
      };
      document.body.appendChild(loader);
      setInterval(()=>{
        if(quitting||typeof window.getBrowserSaveStatus!=="function")return;
        const status=window.getBrowserSaveStatus();
        saveStatus.textContent=status.error?"저장하지 못했어요.":status.pending?"저장 중…":"";
      },300);
      window.addEventListener("beforeunload",event=>{
        if(typeof window.getBrowserSaveStatus!=="function")return;
        const status=window.getBrowserSaveStatus();
        if(status.pending||status.error){event.preventDefault();event.returnValue="";}
      });
    })();
  </script>
