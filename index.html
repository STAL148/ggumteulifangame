<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
  <meta name="description" content="SOOP 스트리머 꿈틀의 팬게임, 방송은 어려워. 소재를 조합하고 나만의 방송을 준비하세요.">
  <title>방송은 어려워</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#181b2b;color:#f2f0f6}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center}
    #game-shell{
      --viewport-height:100vh;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --game-width:min(calc(100vw - var(--safe-left) - var(--safe-right)),calc((var(--viewport-height) - var(--safe-top) - var(--safe-bottom)) * 1.6));
      position:relative;display:grid;place-items:center;width:100%;height:var(--viewport-height);background:#181b2b;
      padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    }
    @supports(height:100dvh){#game-shell{--viewport-height:100dvh}}
    #unity-canvas{display:block;width:var(--game-width);height:calc(var(--game-width) * .625);outline:none;background:#181b2b;touch-action:none}
    #fullscreen-help button:focus-visible{outline:3px solid #72e6c4;outline-offset:2px}
    #fullscreen-help{
      position:absolute;z-index:4;top:calc(var(--safe-top) + 12px);right:calc(var(--safe-right) + 12px);
      display:flex;gap:10px;align-items:center;max-width:min(360px,calc(100% - var(--safe-right) - var(--safe-left) - 24px));
      padding:10px 12px;background:#282e45;color:#f2f0f6;border:1px solid #77719f;border-radius:10px;
      font-size:13px;line-height:1.5;word-break:keep-all;
    }
    #fullscreen-message{white-space:pre-line}
    #fullscreen-help[hidden]{display:none}
    #fullscreen-help button{flex:none;min-height:44px;padding:0 12px;border:0;border-radius:6px;background:#ae9dff;color:#181b2b;font:inherit;cursor:pointer}
    #cover{
      position:absolute;inset:0;display:flex;overflow:auto;background:#181b2b;z-index:2;
      padding:calc(var(--safe-top) + 28px) max(16px,var(--safe-right)) calc(var(--safe-bottom) + 28px) max(16px,var(--safe-left));
    }
    #cover[hidden]{display:none}.intro{width:min(520px,100%);margin:auto;text-align:center}h1{font-size:clamp(30px,5vw,48px);font-weight:650;letter-spacing:-.06em;margin:0 0 20px;color:#72e6c4}
    #message{margin:0 0 24px;color:#a8adc7;font-size:16px;line-height:1.6;white-space:pre-line}progress{display:block;border:0;border-radius:8px;width:100%;height:10px;overflow:hidden;margin:0 0 24px;accent-color:#ae9dff}
    progress[hidden]{display:none}progress::-webkit-progress-bar{background:#343a53}progress::-webkit-progress-value{background:#ae9dff}progress::-moz-progress-bar{background:#ae9dff}
    #action{border:0;border-radius:12px;min-width:200px;padding:15px 24px;background:#ae9dff;color:#181b2b;font:inherit;font-size:17px;font-weight:600;cursor:pointer}#action:hover{background:#c3b7ff}#action:focus-visible{outline:3px solid #72e6c4;outline-offset:4px}#action[hidden]{display:none}
    .credit{margin:28px 0 0;font-size:13px;font-weight:400;line-height:1.7;color:#a8adc7;word-break:keep-all;overflow-wrap:anywhere}.signature{margin:8px 0 0;font-size:12px;font-weight:400;color:#7a8193}#save-status{position:absolute;right:12px;bottom:8px;z-index:1;background:#181b2be8;border-radius:6px;padding:6px 10px;font-size:12px;color:#a8adc7;pointer-events:none}#save-status:empty{display:none}
    .patch-notes{margin:14px 0 0;color:#c9c5df;font-size:12px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
    .patch-notes p{margin:0}
    #loading-version{position:absolute;right:max(16px,var(--safe-right));bottom:calc(var(--safe-bottom) + 12px);font-size:12px;line-height:1;color:#7a8193;pointer-events:none}
    @media(max-height:430px){h1,#message,progress{margin-bottom:12px}.credit{margin-top:16px}.patch-notes{margin-top:8px}}
  </style>
</head>
<body>
  <main id="game-shell" aria-label="방송은 어려워">
    <canvas id="unity-canvas" width="1280" height="800" tabindex="0" aria-label="방송은 어려워 게임 화면"></canvas>

    <div id="fullscreen-help" hidden>
      <span id="fullscreen-message" role="status"></span>
      <button id="fullscreen-help-close" type="button" aria-label="전체화면 안내 닫기">닫기</button>
    </div>
    <section id="cover" aria-live="polite">
      <div class="intro">
        <h1>방송은 어려워</h1>
        <p id="message">불러오는 중… 0%</p>
        <progress id="progress" value="0" max="1" aria-label="게임 불러오기"></progress>
        <button id="action" type="button" hidden>방송 시작</button>
        <p class="credit">본 게임은 soop 스트리머 '꿈틀'의 팬게임 입니다.<br>무단 도용과 불펌은 삼가해주세요</p>
        <p class="signature">-개발자 올림-</p>
        <div class="patch-notes">
          <p>패치노트 : 이제부터 특정 방송 컨텐츠 계열의 강화 카드가 나옵니다.</p>
          <p>우측 상단의 옵션에서 전체화면 클릭시. 모바일에서도 쾌적한 플레이가 가능합니다.</p>
        </div>
      </div>
      <span id="loading-version">v1.0.1</span>
    </section>
    <output id="save-status" aria-live="polite"></output>
  </main>
  <script type="application/json" id="streamer-chunks">{"schema":1,"assets":{"dataUrl":{"bytes":80877180,"sha256":"098273fb1741a9e98b1d39e6d47c71f51f1abf0f5c46847c66243bd5401738d1","original":"Build/c35fbe8679ff3c467e2549c55c697045.data.unityweb","parts":[{"index":0,"url":"Build/c35fbe8679ff3c467e2549c55c697045.data.unityweb.part-000.bin","bytes":20971520,"sha256":"17250730eec85d3cb029ce9e99d7c8e47c85a85bf42647567b37ed59cd2f478e"},{"index":1,"url":"Build/c35fbe8679ff3c467e2549c55c697045.data.unityweb.part-001.bin","bytes":20971520,"sha256":"0d1dea42e6ef66f7d96c8e7338220db05bd5dc6bda9a4c9e449d4d015e968973"},{"index":2,"url":"Build/c35fbe8679ff3c467e2549c55c697045.data.unityweb.part-002.bin","bytes":20971520,"sha256":"6c68cd2b56b35b93f7820b39243fe096b35555fee86dd0820dd20f900e28e3eb"},{"index":3,"url":"Build/c35fbe8679ff3c467e2549c55c697045.data.unityweb.part-003.bin","bytes":17962620,"sha256":"dd4efe85bfef7065b7148b7ec12d1acedbe256a48fa5f2b819004978185f5bf1"}]}}}</script>
  <script>
    (() => {
      "use strict";
      const canvas=document.getElementById("unity-canvas"),cover=document.getElementById("cover"),message=document.getElementById("message"),progress=document.getElementById("progress"),action=document.getElementById("action"),saveStatus=document.getElementById("save-status");
      const shell=document.getElementById("game-shell");

      const fullscreenHelp=document.getElementById("fullscreen-help");
      const fullscreenMessage=document.getElementById("fullscreen-message");
      let failed=false,quitting=false;

      function isFullscreen(){
        return (document.fullscreenElement||document.webkitFullscreenElement)===shell;
      }
      function syncFullscreen(){
        if(isFullscreen())fullscreenHelp.hidden=true;
      }
      function explainFullscreen(){
        const appleMobile=/iPad|iPhone|iPod/.test(navigator.userAgent)||
          (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
        const standalone=navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
        fullscreenHelp.hidden=false;
        fullscreenMessage.textContent=standalone?"홈 화면 앱으로 열려 있어요.":appleMobile?
          "Safari에서 공유 → 홈 화면에 추가 → 웹 앱으로 열기 → 추가를 선택하세요. 홈 화면에 생긴 아이콘으로 열면 주소창 없이 플레이할 수 있어요.":
          "전체화면을 켤 수 없어요. 브라우저에서 전체화면을 허용한 뒤 다시 눌러 주세요.";
      }
      async function setFullscreen(enabled){
        if(enabled===isFullscreen())return;
        fullscreenHelp.hidden=true;
        try{
          if(enabled){
            // Invoke before awaiting anything so the toolbar click retains its activation.
            if(shell.requestFullscreen&&document.fullscreenEnabled!==false)
              await shell.requestFullscreen({navigationUI:"hide"});
            else if(shell.webkitRequestFullscreen&&document.webkitFullscreenEnabled!==false)
              await shell.webkitRequestFullscreen();
            else explainFullscreen();
          }else if(document.exitFullscreen)await document.exitFullscreen();
          else if(document.webkitExitFullscreen)await document.webkitExitFullscreen();
        }catch{
          explainFullscreen();
        }
        syncFullscreen();
      }
      window.streamerHardSetFullscreen=setFullscreen;
      document.getElementById("fullscreen-help-close").addEventListener("click",()=>{
        fullscreenHelp.hidden=true;
        canvas.focus({preventScroll:true});
      });
      document.addEventListener("fullscreenchange",syncFullscreen);
      document.addEventListener("webkitfullscreenchange",syncFullscreen);
      syncFullscreen();

      const reveal=(text,label,handler)=>{
        fullscreenHelp.hidden=true;
        message.textContent=text;progress.hidden=true;action.textContent=label;action.onclick=handler;action.hidden=false;cover.hidden=false;
      };
      const fail=(error)=>{if(failed)return;failed=true;releaseChunkBlobs();console.error(error);reveal("게임을 불러오지 못했어요.","다시 불러오기",()=>location.reload());};
      const config={
        dataUrl:"Build/c35fbe8679ff3c467e2549c55c697045.data.unityweb",
        frameworkUrl:"Build/23a09a151ce396d4a53359e9796c5eb9.framework.js.unityweb",
        codeUrl:"Build/a7f2e89838e2d9ff3dd6912e5c6e4e2a.wasm.unityweb",
        streamingAssetsUrl:"StreamingAssets",
        companyName:"LocalWorkshop",
        productName:"방송은 어려워",
        productVersion:"1.0.1",
        autoSyncPersistentDataPath:false,
        matchWebGLToCanvasSize:true,
        devicePixelRatio:Math.min(window.devicePixelRatio||1,2),
        showBanner:(text,type)=>{if(type==="error")fail(text);else console.warn(text);}
      };
      const chunkInput=document.getElementById("streamer-chunks");
      const chunkManifest=chunkInput?JSON.parse(chunkInput.textContent):null;
      const chunkAssets=chunkManifest&&chunkManifest.assets?Object.entries(chunkManifest.assets):[];
      const chunkBlobUrls=[];
      const releaseChunkBlobs=()=>{for(const url of chunkBlobUrls)URL.revokeObjectURL(url);chunkBlobUrls.length=0;};
      async function prepareChunkedAssets(){
        if(!chunkAssets.length)return;
        if(chunkManifest.schema!==1||!window.crypto||!window.crypto.subtle)throw new Error("Chunk integrity verification unavailable");
        const allowed=new Set(["dataUrl","codeUrl","frameworkUrl"]);
        let received=0;
        const total=chunkAssets.reduce((sum,[,asset])=>sum+asset.bytes,0);
        if(!Number.isSafeInteger(total)||total<=0||total>1024*1024*1024)throw new Error("Invalid chunk manifest size");
        for(const [field,asset] of chunkAssets){
          if(!allowed.has(field)||!Number.isSafeInteger(asset.bytes)||asset.bytes<=0||!Array.isArray(asset.parts)||!asset.parts.length||asset.parts.length>64)throw new Error("Invalid chunk manifest");
          const parts=new Array(asset.parts.length);let next=0;
          const loadPart=async()=>{
            while(next<asset.parts.length){
              const index=next++,part=asset.parts[index];
              if(part.index!==index||!Number.isSafeInteger(part.bytes)||part.bytes<=0||part.bytes>25*1024*1024||!/^[a-f0-9]{64}$/.test(part.sha256))throw new Error("Invalid chunk descriptor");
              const url=new URL(part.url,document.baseURI);
              if(url.origin!==location.origin)throw new Error("Unexpected chunk origin");
              const response=await fetch(url.href,{cache:"force-cache"});
              if(!response.ok)throw new Error("Chunk download failed: "+response.status);
              const bytes=await response.arrayBuffer();
              if(bytes.byteLength!==part.bytes)throw new Error("Chunk size mismatch");
              const digest=await crypto.subtle.digest("SHA-256",bytes);
              const hash=Array.from(new Uint8Array(digest),value=>value.toString(16).padStart(2,"0")).join("");
              if(hash!==part.sha256)throw new Error("Chunk integrity mismatch");
              parts[index]=bytes;received+=bytes.byteLength;
              progress.value=.65*received/total;
              message.textContent="불러오는 중… "+Math.round(progress.value*100)+"%";
            }
          };
          await Promise.all(Array.from({length:Math.min(2,parts.length)},loadPart));
          const blob=new Blob(parts,{type:"application/octet-stream"});
          if(blob.size!==asset.bytes)throw new Error("Reassembled asset size mismatch");
          const blobUrl=URL.createObjectURL(blob);chunkBlobUrls.push(blobUrl);config[field]=blobUrl;
          parts.length=0;
        }
      }
      window.streamerHardQuit=async()=>{
        if(quitting)return;
        quitting=true;
        try{
          const instance=window.streamerHardInstance;
          if(instance)await instance.Quit();
          window.streamerHardInstance=null;
          saveStatus.textContent="";
          await setFullscreen(false);
          reveal("저장했어요.","다시 시작",()=>location.reload());
        }catch(error){console.error(error);reveal("저장했어요. 이 탭을 닫아도 괜찮아요.","다시 시작",()=>location.reload());}
      };
      const loader=document.createElement("script");
      loader.src="Build/9f1b681ab4de2ee82a71ba9348ce914c.loader.js";
      loader.onerror=()=>fail("Unity loader download failed");
      loader.onload=()=>{
        if(typeof createUnityInstance!=="function"){fail("Unity loader is unavailable");return;}
        prepareChunkedAssets().then(()=>createUnityInstance(canvas,config,value=>{
          progress.value=chunkAssets.length ? .65+.35*value : value;
          message.textContent="불러오는 중… "+Math.round(progress.value*100)+"%";
        })).then(instance=>{
          if(failed){instance.Quit();return;}
          window.streamerHardInstance=instance;
          reveal("준비됐어요.","방송 시작",()=>{cover.hidden=true;canvas.focus({preventScroll:true});});
        }).catch(fail).finally(releaseChunkBlobs);
      };
      document.body.appendChild(loader);
      setInterval(()=>{
        if(quitting||typeof window.getBrowserSaveStatus!=="function")return;
        const status=window.getBrowserSaveStatus();
        saveStatus.textContent=status.error?"저장하지 못했어요.":status.pending?"저장 중…":"";
      },300);
      window.addEventListener("beforeunload",event=>{
        if(typeof window.getBrowserSaveStatus!=="function")return;
        const status=window.getBrowserSaveStatus();
        if(status.pending||status.error){event.preventDefault();event.returnValue="";}
      });
    })();
  </script>
</body>
</html>
